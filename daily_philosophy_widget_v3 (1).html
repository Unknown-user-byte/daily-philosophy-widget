<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 철학 글귀</title>
<style>
:root{color-scheme:light;--ink:#262626;--muted:#777;--line:#e9e6e0;--paper:#fff}
*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}
.card{max-width:780px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.kicker{font-size:11px;letter-spacing:.12em;color:var(--muted)}h1{font-size:18px;margin:3px 0 0;font-weight:650}.count{font-size:11px;color:var(--muted)}
.quote{font-size:16px;line-height:1.9;white-space:pre-line;margin:0 0 18px}.author{font-weight:700;font-size:14px}
details{border-top:1px solid var(--line);margin-top:15px;padding-top:12px}summary{cursor:pointer;font-size:12px;font-weight:650;color:#555}.meta{font-size:12px;line-height:1.8;color:#555;margin-top:10px;overflow-wrap:anywhere}.meta b{color:#333}.meta a{color:inherit}
.controls{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;color:#333}
</style></head><body>
<main class="card">
<div class="top"><div><div class="kicker">DAILY PHILOSOPHY</div><h1>오늘의 철학 글귀</h1></div><div class="count" id="count"></div></div>
<section id="content" aria-live="polite"></section>
<div class="controls"><button id="prev">이전 글귀</button><button id="next">다음 글귀</button><button id="today">오늘의 글귀</button></div>
</main>
<script>
const entries=[{"author": "공자", "roman": "CONFUCIUS", "work": "《논어》 학이편 1.1", "original": "子曰：「學而時習之，不亦說乎？有朋自遠方來，不亦樂乎？人不知而不慍，不亦君子乎？」", "translation": "공자가 말했다. “배우고 때때로 익히면 또한 기쁘지 아니한가? 뜻을 같이하는 벗이 먼 곳에서 찾아오면 또한 즐겁지 아니한가? 남이 알아주지 않아도 서운해하지 않는다면 또한 군자답지 아니한가?”", "source": "Chinese Text Project · 論語 學而", "url": "https://ctext.org/analects/xue-er", "status": "verified", "note": "고전의 짧은 문답을 원문 길이 그대로 수록했습니다. 4~7문장에 맞추려고 문장을 덧붙이지 않았습니다."}, {"author": "노자", "roman": "LAOZI", "work": "《도덕경》 제8장", "original": "上善若水。水善利萬物而不爭，處衆人之所惡，故幾於道。居善地，心善淵，與善仁，言善信，正善治，事善能，動善時。夫唯不爭，故無尤。", "translation": "가장 높은 선은 물과 같다. 물은 만물을 이롭게 하면서도 다투지 않고, 사람들이 싫어하는 낮은 곳에 머무르므로 도에 가깝다. 머무를 때에는 낮은 곳을 택하고, 마음은 깊고 고요하게 하며, 베풂에는 어짊을 담고, 말에는 믿음을 지킨다. 다스림에는 바름을, 일에는 능숙함을, 움직임에는 알맞은 때를 따른다. 오직 다투지 않으므로 허물이 없다.", "source": "RuDao · 王弼本《道德經》 제8장 원문", "url": "https://rudao.org/ch/daodejing", "status": "verified", "note": "제8장 한 대목 전체를 바탕으로 직접 번역했습니다."}, {"author": "쇼펜하우어", "roman": "ARTHUR SCHOPENHAUER", "work": "《소품과 보유》 중 《삶의 지혜》 제2장", "original": "What a man is, and so what he has in his own person, is always the chief thing to consider; for his individuality accompanies him always and everywhere, and gives its color to all his experiences. In every kind of enjoyment, for instance, the pleasure depends principally upon the man himself. Every one admits this in regard to physical, and how much truer it is of intellectual, pleasure. When we use that English expression, “to enjoy one's self,” we are employing a very striking and appropriate phrase; for observe—one says, not “he enjoys Paris,” but “he enjoys himself in Paris.”", "translation": "인간이 어떤 사람인가, 다시 말해 그 사람 안에 무엇을 지니고 있는가가 언제나 가장 중요하다. 개인의 고유한 성향은 언제 어디서나 그와 함께하며, 그가 경험하는 모든 일에 고유한 색채를 입힌다. 이를테면 어떤 즐거움이든 그 기쁨은 주로 그것을 경험하는 사람 자신에게 달려 있다. 육체적 즐거움에서도 그렇지만, 정신적 즐거움에서는 더욱 그러하다. 우리가 ‘스스로를 즐긴다’고 말할 때, 그 표현은 매우 정확하고 의미심장하다. 사람은 ‘파리를 즐긴다’고 하기보다 ‘파리에서 자신을 즐긴다’고 말하기 때문이다.", "source": "Project Gutenberg · The Essays of Arthur Schopenhauer: The Wisdom of Life, T. Bailey Saunders translation", "url": "https://www.gutenberg.org/files/10741/10741-h/10741-h.htm", "status": "verified", "note": "영어 공개 번역본의 연속된 문장을 바탕으로 새롭게 한국어로 옮겼습니다. 번역은 원문과 대조할 수 있도록 출처 번역자를 표시합니다."}, {"author": "니체", "roman": "FRIEDRICH NIETZSCHE", "work": "《선악의 저편》 제4장 잠언과 간주곡, 146절", "original": "He who fights with monsters should be careful lest he thereby become a monster. And if thou gaze long into an abyss, the abyss will also gaze into thee.", "translation": "괴물과 싸우는 사람은 그 과정에서 자신도 괴물이 되지 않도록 조심해야 한다. 네가 심연을 오래 들여다본다면, 심연 또한 너를 들여다볼 것이다.", "source": "Project Gutenberg · Beyond Good and Evil, translated by Helen Zimmern, §146", "url": "https://www.gutenberg.org/cache/epub/4363/pg4363-images.html", "status": "verified", "note": "널리 알려진 원전 문구입니다. 원문이 두 문장인 잠언이므로 문장을 인위적으로 늘리지 않았습니다."}, {"author": "마르쿠스 아우렐리우스", "roman": "MARCUS AURELIUS", "work": "《명상록》 제1권", "original": "From my grandfather Verus I learned good morals and the government of my temper. From the reputation and remembrance of my father, modesty and a manly character. From my mother, piety and beneficence, and abstinence, not only from evil deeds, but even from evil thoughts; and further, simplicity in my way of living, far removed from the habits of the rich. From my great-grandfather, not to have frequented public schools, and to have had good teachers at home, and to know that on such things a man should spend liberally.", "translation": "나는 할아버지 베루스에게서 바른 품성과 감정을 다스리는 법을 배웠다. 아버지의 명성과 기억에서는 겸손과 굳센 인격을 배웠다. 어머니에게서는 경건함과 자비로움, 악한 행동뿐 아니라 악한 생각까지 삼가는 태도를 배웠으며, 부유한 사람들의 생활방식과 거리가 먼 소박한 삶도 배웠다. 증조부에게서는 공공학교에 다니기보다 집에서 훌륭한 스승에게 배우고, 그런 배움에 아낌없이 투자해야 한다는 것을 배웠다.", "source": "MIT Internet Classics Archive · Meditations, Book I, George Long translation", "url": "https://classics.mit.edu/Antoninus/meditations.1.one.html", "status": "verified", "note": "제1권의 연속된 첫 네 문장을 바탕으로 직접 번역했습니다."}, {"author": "세네카", "roman": "SENECA", "work": "《인생의 짧음에 관하여》 제1장", "original": "Non exiguum temporis habemus, sed multum perdimus. Satis longa vita et in maximarum rerum consummationem large data est, si tota bene collocaretur; sed ubi per luxum ac neglegentiam diffluit, ubi nulli bonae rei impenditur, ultima demum necessitate cogente quam ire non intelleximus transisse sentimus. Ita est: non accipimus brevem vitam, sed facimus, nec inopes eius sed prodigi sumus.", "translation": "우리에게 시간이 부족한 것이 아니라, 우리가 많은 시간을 낭비하는 것이다. 삶은 가장 위대한 일을 이루기에 충분히 길게 주어졌으며, 그 시간을 온전히 잘 쓴다면 넉넉하다. 그러나 사치와 무관심 속에 흘려보내고 어떤 가치 있는 일에도 쓰지 않으면, 마지막 순간이 닥쳐서야 시간이 얼마나 지나갔는지 깨닫는다. 그렇다. 우리는 짧은 삶을 받아들이는 것이 아니라 스스로 짧게 만들며, 시간이 모자란 사람이 아니라 시간을 낭비하는 사람이다.", "source": "Ad Fontes Library · Seneca, De Brevitate Vitae, Book 1 (Latin text)", "url": "https://adfonteslibrary.org/work-seneca-on-shortness-of-life", "status": "verified", "note": "라틴어 원문을 바탕으로 직접 번역했습니다. 해당 사이트의 본문은 라틴어 원문이며 번역본은 별도로 대조가 필요합니다."}, {"author": "정약용", "roman": "JEONG YAK-YONG", "work": "《목민심서》 서문", "original": "聖賢之敎，原有二途，司徒敎萬民，使各修身，大學敎國子，使各修身而治民，治民者牧民也。然則君子之學，修身爲半，其半牧民也。聖遠言堙，其道寢晦，今之司牧者，唯征利是急，而不知所以牧之。於是下民嬴困，乃瘰乃瘯，相顚連以實溝壑，而爲牧者方且鮮衣美食以自肥，豈不悲哉。", "translation": "성현의 가르침에는 본래 두 가지 길이 있었다. 사도는 백성을 가르쳐 각자 몸을 닦게 하고, 태학은 국자들을 가르쳐 몸을 닦고 백성을 다스리게 했다. 백성을 다스리는 일이 곧 목민이다. 그러므로 군자의 학문은 자신을 수양하는 일이 절반이고, 나머지 절반은 백성을 다스리는 일이다. 성현의 시대가 멀어지고 그 말씀도 사라져 도가 점점 어두워졌다. 오늘날 백성을 맡아 다스리는 자들은 오직 이익을 거두는 데만 급급하고 백성을 보살피는 방법을 알지 못한다. 그 결과 백성은 여위고 병들어 굶어 죽어 구덩이를 메우는데, 다스리는 자들은 오히려 좋은 옷과 음식을 누리며 자신만 살찌우니 어찌 슬프지 않겠는가.", "source": "국사편찬위원회 사료로 본 한국사 · 《목민심서》 서문 원문 및 번역", "url": "https://contents.history.go.kr/front/hm/print.do?levelId=hm_109_0050&tabId=01&treeId=020306&whereStr=", "status": "verified", "note": "국사편찬위원회가 제시한 한문 원문과 한국어 번역을 대조했습니다. 《여유당전서》 제1집 제12권 시문집, 서, 목민심서서에 해당합니다."}];
const active=entries.map((e,i)=>e.status==="verified"?i:-1).filter(i=>i>=0);
function dayNumber(){const now=new Date();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());return Math.floor(start.getTime()/86400000)}
let day=dayNumber();let index=((day%active.length)+active.length)%active.length;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const e=entries[active[index]];document.getElementById('count').textContent=`${index+1} / ${active.length}`;
document.getElementById('content').innerHTML=`<p class="quote">${esc(e.translation)}</p><div class="author">${esc(e.author)}</div><details><summary>원문 및 출처 확인</summary><div class="meta"><div><b>작품:</b> ${esc(e.work)}</div><div><b>원문:</b><br>${esc(e.original)}</div><div><b>출처:</b> <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.source)}</a></div></div></details>`;}
function move(d){index=(index+d+active.length)%active.length;render();}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);
document.getElementById('today').onclick=()=>{day=dayNumber();index=((day%active.length)+active.length)%active.length;render()};render();
function scheduleMidnightRefresh(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,2);
  setTimeout(()=>{
    day=dayNumber();
    index=((day%active.length)+active.length)%active.length;
    render();
    scheduleMidnightRefresh();
  },Math.max(1000,next.getTime()-now.getTime()));
}
scheduleMidnightRefresh();
</script></body></html>
